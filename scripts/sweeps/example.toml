# Example dynamic-stability data-generation sweep config file
#
# A scenario is one fault simulation = (case, fault_bus, r_fault, duration).
# The driver enumerates the full cross product, shards it round-robin across
# MPI/SLURM ranks, and writes one HDF5 file per (case, rank).
#
#   julia --project=scripts scripts/generate_dynamics.jl scripts/sweeps/example.toml
#
# Scenario count = sum over cases of  n_fault_buses * len(r_fault) * len(durations).

output_root = "./dynstab_out"

[sim]
t_final    = 10.0     # integration horizon (s)
dt         = 0.008333333333333333   # 1/120 s integrator step

[fault]
# buses = "all"  -> fault every bus (internal index 1..n_bus).
# Or give a list of PSS/E bus numbers, e.g. buses = [1, 4, 8].
buses     = "all"
r_fault   = [0.01, 0.05, 0.2]   # fault shunt resistance (pu); smaller = harder
t_on      = 0.2                 # fault application time (s)
durations = [0.05, 0.1, 0.15]   # clearing time = t_off - t_on (s)

[label]
angle_sep_threshold_deg = 180.0
settle_ratio            = 0.5

# One table per case. raw/dyr paths are resolved relative to the repo root unless absolute.
[[cases]]
name = "ieee9"
raw  = "examples/ieee9_v33.raw"
dyr  = "examples/ieee9bus_gov.dyr"

[[cases]]
name = "ieee39"
raw  = "examples/IEEE39.raw"
dyr  = "examples/IEEE39_gov.dyr"
